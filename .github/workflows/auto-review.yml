name: Auto Review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: node-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Automated review
    runs-on: ubuntu-latest
    timeout-minutes: 9
    if: github.event.pull_request.base.ref == 'main'
    steps:
      # Security: trusted main checkout only. Never checkout PR HEAD.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Auto-review new node submissions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/review-pr.mjs
